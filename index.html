<style>
/* JS / Python language toggle (js/python-runtime.js) */
.lang-toggle{display:inline-flex;align-items:center;gap:2px;margin-right:12px;padding:2px;background:#eef2f5;border-radius:4px}
.lang-btn{opacity:.65;padding:2px 8px}
.lang-btn.active{opacity:1;background:#fff;border-radius:3px;box-shadow:0 0 0 1px #c7d1da;font-weight:600}
</style>

<body>
<header class="hr-header">
  <div class="hr-header-inner">
    <div class="hr-logo">
      <svg width="26" height="26" viewBox="0 0 26 26"><rect width="26" height="26" rx="5" fill="#1ba94c"/><path d="M8 6h2.6v6H15V6h2.6v14H15v-5.6H10.6V20H8V6z" fill="#fff"/></svg>
      <span class="hr-logo-text">Practice<b>Rank</b></span>
    </div>
    <nav class="hr-nav">
      <a href="#/" class="hr-nav-link active">Prepare</a>
    </nav>
    <div class="hr-header-right">
      <div class="hr-timer" id="global-timer" title="Session timer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
        <span id="global-timer-text">00:00:00</span>
      </div>
      <button class="hr-debug-btn" id="dbg-toggle" title="Debug console (Ctrl+`)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6"/></svg>
        <span>Debug</span>
      </button>
      <div class="hr-avatar" title="Profile">P</div>
    </div>
  </div>
</header>

<main id="app"></main>
